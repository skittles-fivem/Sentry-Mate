[package]
name = "release"
description = "The release check: this build's number, commit and date, and the opt-in daily question to GitHub's API (api.github.com only, two GETs, no token) whether a newer image of Sentry Mate is published"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets tests point the client at a fake GitHub API on this machine. Only this crate's own dev-dependency turns it on;
# no normal dependency may (checked in crates/sentry-mate/tests/repo_hygiene.rs).
test-endpoints = []

[dependencies]
tesla = { path = "../tesla" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
webpki-roots = "1"

[dev-dependencies]
release = { path = ".", features = ["test-endpoints"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
