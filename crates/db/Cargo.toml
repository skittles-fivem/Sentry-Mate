[package]
name = "db"
description = "Sentry Mate's storage for everything derived: per-car tables and time series, the fleet, places, settings, backups; all sealed with the vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
model = { path = "../model" }
vault = { path = "../vault" }
brotli = { version = "8", default-features = false, features = ["std"] }
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
lz4_flex = "0.14"
lzma-rs = "0.3"
# (for measurements only: crates/db/examples/series_sizes.rs)
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder"] }
miniz_oxide = "0.9"
