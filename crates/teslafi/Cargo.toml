[package]
name = "teslafi"
description = "TeslaFi's API as an input, for owners who pay for TeslaFi: TeslaFi's own polls of the car, read only (never a wake or a command), from TeslaFi's host alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets tests point the client at a fake TeslaFi on this machine. Only this crate's own dev-dependency turns it on; no
# normal dependency may (checked in crates/sentry-mate/tests/repo_hygiene.rs).
test-endpoints = []

[dependencies]
import = { path = "../import" }
model = { path = "../model" }
tesla = { path = "../tesla" }
timeline = { path = "../timeline" }
vault = { path = "../vault" }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
webpki-roots = "1"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
teslafi = { path = ".", features = ["test-endpoints"] }
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
