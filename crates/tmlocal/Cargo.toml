[package]
name = "tmlocal"
description = "The owner's own TeslaMate as a live input: its MQTT broker read only, and optionally its database for catch-up"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
import = { path = "../import" }
model = { path = "../model" }
tesla = { path = "../tesla" }
vault = { path = "../vault" }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
webpki-roots = "1"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
