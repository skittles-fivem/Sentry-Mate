[package]
name = "trust"
description = "Checks the CAN Bridge's log signatures (canbridge-log-sig-v1) and the hash chain across logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
