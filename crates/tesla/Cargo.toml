[package]
name = "tesla"
description = "The Tesla Owner API as an input: sign-in, token refresh, the vehicle list, vehicle data and streaming, read only, and a poller that lets the car sleep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets tests point the client at a fake Tesla server on this machine. Only this crate's own dev-dependency turns
# it on; no normal dependency may (checked in crates/sentry-mate/tests/repo_hygiene.rs).
test-endpoints = []

[dependencies]
model = { path = "../model" }
timeline = { path = "../timeline" }
vault = { path = "../vault" }
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
webpki-roots = "1"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tesla = { path = ".", features = ["test-endpoints"] }
hyper = { version = "1", features = ["client", "http2", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
