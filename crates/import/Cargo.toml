[package]
name = "import"
description = "Brings old history into Sentry Mate: TeslaMate's own backup (plain SQL, gzip or xz) and TeslaFi's data download (CSV, zip, gzip or xz), read as data, per car, streamed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
model = { path = "../model" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Unpacks as it is read, holding only the xz window (lzma-rs holds a whole xz block: the whole file for what the `xz`
# tool makes by default). Without its "optimization" feature the crate forbids unsafe code.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
crc32fast = "1"
serde_json = "1"
# xz files as another implementation makes them.
lzma-rs = "0.3"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
