[package]
name = "sentry-mate"
description = "Sentry Mate: a car logger fed by the Screenmate CAN Bridge's uploads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "sentry-mate"
path = "src/main.rs"

[features]
# The hidden `dev seed` command (made-up cars for development). Off in the image and every release build: a server
# built with it can be filled with made-up cars whose signing keys come from a public seed.
dev-seed = ["dep:synth", "dep:import"]

[dependencies]
accounts = { path = "../accounts" }
db = { path = "../db" }
dbc = { path = "../dbc" }
engine = { path = "../engine" }
gate = { path = "../gate" }
import = { path = "../import", optional = true }
moving = { path = "../moving" }
ingest = { path = "../ingest" }
logfmt = { path = "../logfmt" }
model = { path = "../model" }
release = { path = "../release" }
synth = { path = "../synth", optional = true }
timeline = { path = "../timeline" }
trust = { path = "../trust" }
vault = { path = "../vault" }
web = { path = "../web" }
zeroize = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
serde = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
synth = { path = "../synth" }
tesla = { path = "../tesla" }
teslafi = { path = "../teslafi" }
tmlocal = { path = "../tmlocal" }
import = { path = "../import" }
base64 = "0.22"
lzma-rs = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile = "3"
