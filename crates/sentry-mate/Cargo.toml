[package]
name = "sentry-mate"
description = "Sentry Mate: a car logger fed by the Screenmate CAN Bridge's uploads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "sentry-mate"
path = "src/main.rs"

[dependencies]
ingest = { path = "../ingest" }
logfmt = { path = "../logfmt" }
trust = { path = "../trust" }
vault = { path = "../vault" }
zeroize = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
