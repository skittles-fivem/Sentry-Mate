[package]
name = "ingest"
description = "Receives CAN Bridge logs: the upload API (ping, status, resumable chunks) over TLS 1.3, tokens, trust records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
trust = { path = "../trust" }
logfmt = { path = "../logfmt" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
base64 = "0.22"
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
