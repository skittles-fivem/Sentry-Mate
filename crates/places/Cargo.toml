[package]
name = "places"
description = "Places, addresses and electricity prices: geofences, parking suggestions, charge costs, reverse geocoding (offline and online), map tile settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
model = { path = "../model" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
crc32fast = "1"
miniz_oxide = "0.8"
# Already in the tree through ureq; named here only to recognise its errors.
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
