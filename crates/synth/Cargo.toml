[package]
name = "synth"
description = "Made-up but realistic CAN Bridge logs (signed, chained, both formats) for testing Sentry Mate end to end without anyone's car"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dbc = { path = "../dbc" }
logfmt = { path = "../logfmt" }
model = { path = "../model" }
trust = { path = "../trust" }
base64 = "0.22"
hex = "0.4"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
timeline = { path = "../timeline" }
