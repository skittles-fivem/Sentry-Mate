[package]
name = "engine"
description = "The background pipeline that turns checked logs into each car's history, and the read side the web API needs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
db = { path = "../db" }
dbc = { path = "../dbc" }
import = { path = "../import" }
ingest = { path = "../ingest" }
logfmt = { path = "../logfmt" }
model = { path = "../model" }
places = { path = "../places" }
timeline = { path = "../timeline" }
trust = { path = "../trust" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
hex = "0.4"
lzma-rs = "0.3"
synth = { path = "../synth" }
tempfile = "3"
vault = { path = "../vault" }
