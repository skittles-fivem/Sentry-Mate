[package]
name = "engine"
description = "The background pipeline that turns checked logs into each car's history, and the read side the web API needs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
db = { path = "../db" }
dbc = { path = "../dbc" }
gate = { path = "../gate" }
import = { path = "../import" }
ingest = { path = "../ingest" }
logfmt = { path = "../logfmt" }
model = { path = "../model" }
mqtt = { path = "../mqtt" }
places = { path = "../places" }
tesla = { path = "../tesla" }
teslafi = { path = "../teslafi" }
tmlocal = { path = "../tmlocal" }
timeline = { path = "../timeline" }
trust = { path = "../trust" }
vault = { path = "../vault" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tzf-rs = { version = "2.3", default-features = false, features = ["bundled"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
lzma-rs = "0.3"
synth = { path = "../synth" }
tempfile = "3"
