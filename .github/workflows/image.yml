name: Image

# Tests Sentry Mate and publishes its Docker image to GitHub's registry,
# ghcr.io/<owner>/<repo> (ghcr.io/skittles-fivem/sentry-mate), for amd64 and
# arm64.
#   - Every image gets a build number: this workflow's run number, which
#     only ever goes up (runs that published nothing leave gaps). It shows in
#     `sentry-mate --version` as build-N, with sha-<commit> and the date, and
#     in the label org.opencontainers.image.version=build-N.
#   - A push to main that changes code publishes `latest`, `build-N` and
#     `sha-<commit>` (pin a `build-` or `sha-` tag in the compose file to
#     stay on, or go back to, a version).
#   - Running it by hand for another branch (Actions > Image > Run workflow)
#     publishes an image tagged with that branch's name, and `sha-<commit>`
#     when no image has that tag yet (no `build-N` tag: those are only for
#     releases from main). A branch or git tag named latest, build-... or
#     sha-... gets branch- in front, so it never replaces a release's tag.
#   - A push that changes only README.md, docs/, truenas/ or ui/archived/
#     runs nothing: no code changed, so there is nothing to test and no new
#     image (the archived UI packs are not built, served or tested:
#     ui/archived/README.md).
# This replaces ci.yml: it ran the same tests on every push to main, so with
# this file they would have run twice.
# The owner's limit: a push to main takes at most 5 minutes, tests and image
# (docs/development.md has what the runs so far measured; check the job times
# on a run's page).
#   - tests runs the fast set (cargo test --workspace --locked, split in
#     four parts on five machines at once (web on two), each running its test binaries
#     several at a time): every unit test and the quick
#     integration tests, which still take each main
#     feature end to end once (upload, check, decode, a drive and a charge on
#     the web API; sign-in and accounts; places; imports; the Tesla client;
#     moving; the certificate; the packs). The slow tests, which decode
#     several days of made-up logs each, are #[ignore]d and run in
#     full-tests.yml (weekly and by hand). docs/development.md has both sets.
#   - clippy and cargo fmt run beside them, on a machine of their own.
#   - the binary is built on each arch's runner by .github/build-binary.sh,
#     in the Dockerfile's own Rust image, with its build folder kept per
#     arch (an artifact of main's last run): a push builds again only the
#     crates it changed (a change to ui/packs: web and sentry-mate), and
#     those incremental: 20 to 40 s for a change to web or engine (only the
#     newest incremental session of each crate is kept: two made the folder
#     pass 3 GB, and the build start over, every other run). In
#     the Docker build it took 6 to 7.5 minutes a run (every workspace crate
#     each time; with full LTO and one codegen unit 9, so the release
#     profile in Cargo.toml has neither). The image is then made from the
#     Dockerfile with that binary in place of its build stages.
# The tests, clippy and the two images (each on its own kind of
# machine, no emulation) run at the same time. The images are pushed only by
# digest, which nobody pulls; the tags that people pull are put on them last,
# and only when the tests and clippy passed and both images passed
# .github/check-image.sh, as 1000:1000 and as TrueNAS's 568:568: folders it
# can't keep refused (root's, not mounted, the keys inside the data), no
# capabilities, a read-only root, healthy, TLS 1.3 only, the recovery key
# file in keys, a token made with docker exec, a clean stop, the same
# certificate after a restart.
# Every action is pinned to a full commit id (its version in the comment) and
# the Rust base image in the Dockerfile to a digest: a moved tag or branch
# upstream can't change what runs here with the packages:write token, or what
# goes into `latest`. Dependabot (.github/dependabot.yml) proposes the bumps;
# crates/sentry-mate/tests/repo_hygiene.rs fails on an unpinned one.
# New packages are private: make it public once under the owner's
# Packages > sentry-mate > Package settings so anyone can pull it.

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'truenas/**', 'ui/archived/**']
  workflow_dispatch:

# Read-only by default; only the jobs that push images may write packages.
permissions:
  contents: read

# On main a newer push waits for the running build and replaces only one still
# waiting (GitHub keeps one waiting per group): every build that starts
# finishes and moves `latest`, and keeps its build folder for the next. A
# cancelled build kept nothing, and a push every few minutes cancelled every
# build, so `latest` stayed behind. A branch run by hand: a newer one replaces it.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.names.outputs.image }}
      tag: ${{ steps.names.outputs.tag }}
      sha: ${{ steps.names.outputs.sha }}
      short: ${{ steps.names.outputs.short }}
      created: ${{ steps.names.outputs.created }}
      build: ${{ steps.names.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and tag
        id: names
        run: |
          branch="$GITHUB_REF_NAME"
          if [ "$branch" = main ]; then tag=latest; else tag="${branch//[^A-Za-z0-9_.-]/-}"; tag="${tag#[.-]}"; fi
          # latest, build-N and sha- are main's tags: a branch named like one gets branch- in front
          if [ "$branch" != main ]; then case "$tag" in latest|build-*|sha-*) tag="branch-$tag" ;; esac; fi
          sha="$(git rev-parse HEAD)"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=${tag:0:120}"
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "build=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

  # The fast set, in four parts on five machines at once (web on two), parted
  # by the time each crate's tests took in run 24: web alone; synth, engine and moving;
  # import, places, the binary, accounts and timeline; every other crate (a
  # new crate lands there by itself). Each part builds its test binaries once
  # with its dependencies from the cache (web: about 2 minutes), then
  # .github/run-tests.py runs them as many at a time as the machine has
  # cores, where cargo test runs one at a time and most of them wait more
  # than they work (web took 3 minutes of tests that way in run 79, its
  # slowest binary 46 s). web's binaries are dealt out to two machines by
  # the times they took (--slow): both build them all, each runs half.
  # The slow tests are in full-tests.yml.
  tests:
    name: tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # (web's binaries on two machines, dealt out by the times they took in run 85)
          - part: web 1
            packages: -p web
            split: --part 1/2 --slow audit_log=60,charges=45,now_timeline=25,missing_logs=23,system=16,log_queries=15,long_series=11,drives_checks=9,auth_attacks=8,imports_teslafi=8
          - part: web 2
            packages: -p web
            split: --part 2/2 --slow audit_log=60,charges=45,now_timeline=25,missing_logs=23,system=16,log_queries=15,long_series=11,drives_checks=9,auth_attacks=8,imports_teslafi=8
          - part: engine
            packages: -p synth -p engine -p moving
          - part: import
            packages: -p import -p places -p timeline
          # (sentry-mate's own tests: the rebuild proofs need a machine of their own; accounts beside it, as a
          # binary alone has no doc tests to run)
          - part: sentry-mate
            packages: -p sentry-mate -p accounts
            minutes: 25
          - part: rest
            packages: >-
              --workspace --exclude web --exclude synth --exclude engine --exclude moving
              --exclude import --exclude places --exclude sentry-mate --exclude accounts --exclude timeline
    steps:
      # (the tests never see a token)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      # (the dependencies only; main writes it, a branch run by hand only reads)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tests-${{ matrix.packages == '-p web' && 'web' || matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # (several test binaries at once: .github/run-tests.py)
      - run: .github/run-tests.py ${{ matrix.split }} -- --locked ${{ matrix.packages }}

  # Beside the tests, on a machine of its own (its own build cache too).
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p sentry-mate --all-targets --features dev-seed --locked -- -D warnings

  # The binary is built on the runner (.github/build-binary.sh: in the
  # Dockerfile's own Rust image, with the Dockerfile's command), with the
  # build folder kept from main's last run, so a push builds again only the
  # crates it changed (often only web and sentry-mate, which embed ui/packs),
  # and those incremental. Then the image is made from the Dockerfile with
  # that binary in place of its two build stages (build-contexts: binary=):
  # the same two layers on the same empty image, the same user and labels.
  # The kept folder is an artifact of main's run (one per arch and Rust
  # image, kept 14 days), found by name with the API and read with
  # download-artifact; a run with none (the first, or after 14 days without
  # a push) builds everything once. Only a run on main keeps one; a branch
  # run by hand reads main's and keeps nothing.
  build:
    needs: names
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The kept build folder of main's last run
        id: kept
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="$(awk 'toupper($1) == "FROM" && $2 ~ /^rust:/ { print $2; exit }' Dockerfile)"
          name="kept-build-${{ matrix.arch }}-$(printf %s "$image" | sha256sum | cut -c1-16)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          run="$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=20" |
            python3 -c 'import json, sys
          a = [x for x in json.load(sys.stdin).get("artifacts", [])
               if not x.get("expired") and (x.get("workflow_run") or {}).get("head_branch") == "main"]
          print(a[0]["workflow_run"]["id"] if a else "")')" || run=""
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$name: ${run:-none}"
      - name: Download the kept build folder
        if: steps.kept.outputs.run != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.kept.outputs.name }}
          path: ${{ runner.temp }}/kept
          run-id: ${{ steps.kept.outputs.run }}
          github-token: ${{ github.token }}
      - name: Unpack the kept build folder
        run: |
          mkdir -p ~/.cache/sentry-mate-build
          f="$(ls "$RUNNER_TEMP"/kept/kept.tar.* 2>/dev/null | head -1 || true)"
          if [ -z "$f" ]; then echo "none kept: everything is built"; exit 0; fi
          case "$f" in *.zst) un=(zstd -dc) ;; *) un=(gzip -dc) ;; esac
          if ! "${un[@]}" "$f" | tar -x -C ~/.cache/sentry-mate-build; then
            echo "::warning::the kept build folder did not unpack: everything is built"
            rm -rf ~/.cache/sentry-mate-build
            mkdir -p ~/.cache/sentry-mate-build
          fi
          rm -rf "$RUNNER_TEMP/kept"
          du -sh ~/.cache/sentry-mate-build
      - name: Build the binary (${{ matrix.arch }})
        env:
          BUILD_NUMBER: ${{ needs.names.outputs.build }}
          GIT_SHA: ${{ needs.names.outputs.sha }}
          BUILD_DATE: ${{ needs.names.outputs.created }}
        run: .github/build-binary.sh ~/.cache/sentry-mate-build "$RUNNER_TEMP/binary"
      # (packed beside the image's build and check, uploaded at the end)
      - name: Pack the build folder to keep (main)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          cd ~/.cache/sentry-mate-build
          if command -v zstd >/dev/null; then ext=zst; comp='zstd -T0 -1 -q'; else ext=gz; comp='gzip -1'; fi
          dirs=target
          for d in home/registry/index home/registry/cache home/git/db; do if [ -d "$d" ]; then dirs="$dirs $d"; fi; done
          out="$RUNNER_TEMP/keep/kept.tar.$ext"
          nohup bash -c "set -o pipefail; tar -cf - $dirs | $comp > '$out'; echo \$? > '$RUNNER_TEMP/keep.done'" \
            > "$RUNNER_TEMP/keep.log" 2>&1 &

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # (no layer cache: the two layers are the binary and two empty folders)
      - name: Build for checking (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: binary=${{ runner.temp }}/binary
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sentry-mate:check
          build-args: |
            BUILD_NUMBER=${{ needs.names.outputs.build }}
            GIT_SHA=${{ needs.names.outputs.sha }}
            BUILD_DATE=${{ needs.names.outputs.created }}

      # as the image's own user (1000), then as TrueNAS's apps user (568)
      - name: Check the image
        env:
          EXPECT_VERSION: build-${{ needs.names.outputs.build }}, sha-${{ needs.names.outputs.short }}
        run: |
          label="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' sentry-mate:check)"
          [ "$label" = "build-${{ needs.names.outputs.build }}" ] || { echo "::error::version label: $label"; exit 1; }
          .github/check-image.sh sentry-mate:check
          .github/check-image.sh sentry-mate:check 568

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only (no tag): the same binary and Dockerfile, from
      # the builder's cache of the check above
      - name: Push by digest (${{ matrix.arch }})
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: binary=${{ runner.temp }}/binary
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_NUMBER=${{ needs.names.outputs.build }}
            GIT_SHA=${{ needs.names.outputs.sha }}
            BUILD_DATE=${{ needs.names.outputs.created }}

      - name: Keep the digest
        run: |
          mkdir -p digests
          digest="${{ steps.push.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest"; exit 1; }
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

      # Last, after the image passed its check: main only
      # (a build folder not kept never stops the image: the next run builds more)
      - name: Wait for the packed build folder (main)
        id: packed
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for _ in $(seq 600); do [ -f "$RUNNER_TEMP/keep.done" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/keep.log" || true
          [ "$(cat "$RUNNER_TEMP/keep.done" 2>/dev/null)" = 0 ] || { echo "::warning::the build folder was not packed"; exit 1; }
          ls -l "$RUNNER_TEMP"/keep/
      - name: Keep the build folder (main)
        if: github.ref == 'refs/heads/main' && steps.packed.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.kept.outputs.name }}
          path: ${{ runner.temp }}/keep/kept.tar.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [names, tests, clippy, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both images (amd64, arm64)
        working-directory: digests
        run: |
          image="${{ needs.names.outputs.image }}"
          tag="${{ needs.names.outputs.tag }}"
          sha="$image:sha-${{ needs.names.outputs.short }}"
          test "$(ls | wc -l)" -eq 2
          tags=()
          if [ "$tag" = latest ]; then
            # a release (main): build-N only for one
            tags+=(-t "$sha" -t "$image:build-${{ needs.names.outputs.build }}")
          elif ! docker buildx imagetools inspect "$sha" >/dev/null 2>&1; then
            # a branch run by hand: sha- only for a commit no image has yet (a
            # branch just reset to main would move the release's)
            tags+=(-t "$sha")
          fi
          # The tags are pushed one after another, in this order: the one that
          # moves (latest, or the branch's) last, so a run cancelled in between
          # never leaves latest on a build whose build-N tag is missing.
          tags+=(-t "$image:$tag")
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$tag"
