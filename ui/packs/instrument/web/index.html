  <div class="app" id="app">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#/fleet" aria-label="Sentry Mate, all cars">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#g-logo)"/><path d="M7.5 17.5h4.2l2.6-6.3 3.4 9.6 2.4-5.4h4.4" fill="none" stroke="#06111C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-text"><span class="brand-name">Sentry Mate</span><span class="brand-sub">Car logger</span></span>
      </a>

      <nav class="nav" aria-label="Pages">
        <a class="nav-link" title="All cars" data-nav="fleet" href="#/fleet"><svg class="ico"><use href="#i-fleet"/></svg><span>All cars</span><span class="nav-count" id="nav-fleet-count"></span></a>

        <div class="nav-section">
          <span class="nav-label" id="nav-car-label">Car</span>
          <button class="car-switch" id="car-switch" type="button" aria-haspopup="dialog" aria-controls="switcher" aria-describedby="nav-car-label">
            <svg class="ico car-switch-ico" aria-hidden="true" focusable="false"><use href="#i-car"/></svg>
            <span class="car-switch-dot" id="car-switch-dot" data-state="unknown" aria-hidden="true"></span>
            <span class="car-switch-text">
              <span class="car-switch-name" id="car-switch-name">Choose a car</span>
              <span class="car-switch-sub" id="car-switch-sub"><span class="car-switch-sub-text">Search any car</span></span>
            </span>
            <kbd class="kbd" id="car-switch-kbd">Ctrl K</kbd>
          </button>
          <a class="nav-link" title="Now" data-nav="now" href="#/fleet"><svg class="ico"><use href="#i-gauge"/></svg><span>Now</span></a>
          <a class="nav-link" title="Drives" data-nav="drives" href="#/fleet"><svg class="ico"><use href="#i-route"/></svg><span>Drives</span></a>
          <a class="nav-link" title="Charges" data-nav="charges" href="#/fleet"><svg class="ico"><use href="#i-bolt"/></svg><span>Charges</span></a>
          <a class="nav-link" title="Timeline" data-nav="timeline" href="#/fleet"><svg class="ico"><use href="#i-timeline"/></svg><span>Timeline</span></a>
          <a class="nav-link" title="Battery" data-nav="battery" href="#/fleet"><svg class="ico"><use href="#i-battery"/></svg><span>Battery</span></a>
          <a class="nav-link" title="Stats" data-nav="stats" href="#/fleet"><svg class="ico"><use href="#i-stats"/></svg><span>Stats</span></a>
          <a class="nav-link" title="Signals" data-nav="signals" href="#/fleet"><svg class="ico"><use href="#i-signals"/></svg><span>Signals</span></a>
          <a class="nav-link" title="Logs" data-nav="logs" href="#/fleet"><svg class="ico"><use href="#i-logs"/></svg><span>Logs</span></a>
        </div>
      </nav>

      <div class="sidebar-foot">
        <a class="nav-link" title="Settings" data-nav="settings" href="#/settings"><svg class="ico"><use href="#i-settings"/></svg><span>Settings</span></a>
        <button class="account" id="account-btn" type="button" title="Account and interface size" aria-haspopup="dialog" aria-expanded="false" aria-controls="account-menu" popovertarget="account-menu">
          <span class="avatar" aria-hidden="true">O</span>
          <span class="account-text"><span class="account-name">Owner</span><span class="account-role">Admin · all cars</span></span>
          <svg class="ico ico--sm account-chev" aria-hidden="true" focusable="false"><use href="#i-chev-ud"/></svg>
        </button>
      </div>
    </aside>

    <div class="main">
      <div class="notices" id="notices" role="region" aria-label="Server notices" hidden></div>
      <header class="topbar">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-tools">
          <span class="freshness" id="freshness" title="Cars upload their logs about once a minute, so the newest data is about a minute old.">
            <span class="live-dot" aria-hidden="true"></span>
            <svg class="ico freshness-late" aria-hidden="true" focusable="false"><use href="#i-clock"/></svg>
            <span id="freshness-text" aria-live="polite">Data arrives ≈1 min behind</span>
          </span>
          <span class="clock" id="clock" aria-label="Time in America/Chicago"></span>
          <div class="seg seg--units" role="group" aria-label="Units">
            <button type="button" class="seg-btn" data-units="imperial" aria-pressed="true">mi · °F · psi</button>
            <button type="button" class="seg-btn" data-units="metric" aria-pressed="false">km · °C · bar</button>
          </div>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1" aria-busy="true"></main>
    </div>
  </div>

  <div class="account-menu" id="account-menu" popover role="dialog" aria-label="Account">
    <div class="account-menu-head"><b>Owner</b><span>Admin · all cars</span></div>
    <div class="account-menu-label" id="am-size-label">Interface size <output id="am-size-note"></output></div>
    <div class="size-picker size-picker--grid" id="am-size" role="radiogroup" aria-labelledby="am-size-label"></div>
    <a class="account-menu-link" href="#/settings" id="am-settings"><svg class="ico" aria-hidden="true" focusable="false"><use href="#i-settings"/></svg>Display settings</a>
  </div>

  <dialog class="switcher" id="switcher" aria-labelledby="switcher-title">
    <h2 class="sr-only" id="switcher-title">Switch car</h2>
    <div class="sw-search">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="sw-input" type="text" role="combobox" aria-expanded="true" aria-controls="sw-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Search by name, key, model or place">
      <kbd class="kbd">Esc</kbd>
    </div>
    <div class="sw-list" id="sw-list" role="listbox" aria-label="Cars"></div>
    <div class="sw-foot">
      <span class="sw-keys"><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> move <span class="sw-sep" aria-hidden="true">·</span> <kbd class="kbd">PgUp</kbd><kbd class="kbd">PgDn</kbd> by 5 <span class="sw-sep" aria-hidden="true">·</span> <kbd class="kbd">↵</kbd> open <span class="sw-sep" aria-hidden="true">·</span> <kbd class="kbd" id="sw-kbd-k">Ctrl K</kbd> close</span>
      <a class="sw-all" id="sw-all" href="#/fleet">All cars <svg class="ico" aria-hidden="true"><use href="#i-arrow-r"/></svg></a>
    </div>
  </dialog>
</body>
</html>
