<!doctype html>
<html lang="en" data-theme="dark" data-cover="web.shell.document-language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0E1116">
  <title data-cover="shell.page_title web.shell.page-title">Sentry Mate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest" data-cover="shell.installable web.shell.installable">
  <!-- before the first paint: the Interface size and theme this browser used last -->
  <script src="/boot.js"></script>
  <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script src="/core/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#view">skip to content</a>
  <header class="top" id="top">
    <div class="cmd" id="cmd"></div>
    <nav class="links" id="links" aria-label="Pages"></nav>
  </header>
  <div class="scroller" id="scroller">
    <div class="notices" id="notices" role="region" aria-label="Server notices" hidden></div>
    <main class="view" id="view" tabindex="-1" aria-busy="true"></main>
    <footer class="foot" id="foot"></footer>
  </div>
  <div class="toasts" id="toasts" aria-live="polite" data-cover="shell.banner.flash web.shell.flash"></div>
</body>
</html>
